[package]
name = "hsr-companion"
version = "1.1.1"
description = "HSR Companion — outil de fan pour Honkai: Star Rail"
edition = "2021"
license = "MIT"
default-run = "hsr-companion"

# Outil de développement (régénère app/js/assets.js) : compilé seulement avec `--features tools`,
# sinon Tauri l'embarquerait dans l'installateur des joueurs.
[[bin]]
name = "build_assets"
path = "src/bin/build_assets.rs"
required-features = ["tools"]

[features]
tools = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
unicode-normalization = "0.1"
regex = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
