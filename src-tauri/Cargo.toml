[package]
name = "hsr-companion"
version = "1.0.0"
description = "HSR Companion — outil de fan pour Honkai: Star Rail"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
